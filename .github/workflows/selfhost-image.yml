name: Self-host Image

# Builds the AFFiNE self-host image from THIS repository's source and publishes
# it to ghcr.io/<owner>/<repo>, so a Coolify deploy is a pull rather than a
# 30-60 minute compile on the app server.
#
# Pair it with .docker/coolify/compose.registry.yaml.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (comma separated)'
        type: string
        required: false
        default: 'linux/amd64'
      build-type:
        description: 'AFFiNE build channel'
        type: choice
        required: false
        default: stable
        options:
          - stable
          - beta
          - internal
          - canary
      tag:
        description: 'Extra image tag to publish alongside the defaults'
        type: string
        required: false
  push:
    tags:
      - 'selfhost-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: [self-hosted, default]
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only needed when building for an architecture the runner does not have.
      # The Rust stage under QEMU is very slow, so keep the default at amd64.
      - name: Set up QEMU
        if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Collect image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/coolify/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TYPE=${{ inputs.build-type || 'stable' }}
            GIT_SHA=${{ github.sha }}
            NODE_HEAP_MB=6144
          cache-from: type=gha
          cache-to: type=gha,mode=max
