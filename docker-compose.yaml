# AFFiNE — Coolify deployment, built from this repository's source.
#
# The `affine` service is compiled from the checkout Coolify pulls, using
# .docker/coolify/Dockerfile — it never pulls ghcr.io/toeverything/affine.
#
# Coolify setup (Docker Compose build pack):
#   Base Directory:          /
#   Docker Compose Location: /docker-compose.yaml
#   Domain (affine service): https://your.domain:3010
#
# REQUIRED environment variables — set these in Coolify's Environment
# Variables tab before the first deploy, or it will stop with a clear error:
#   POSTGRES_PASSWORD
#   REDIS_PASSWORD
#
# Everything else has a working default. See .docker/coolify/README.md.
#
# Two Coolify quirks shape this file, do not "tidy" them away:
#   * `environment` uses mapping syntax, never the `- KEY=value` list form.
#     Coolify rewrites the compose file before building and mangles list-form
#     entries into numeric keys, which docker compose then rejects with
#     "non-string key in services.affine.environment: 0".
#     https://github.com/coollabsio/coolify/issues/5064
#   * No SERVICE_FQDN_* / SERVICE_PASSWORD_* magic variables. Those are a
#     Service-resource feature; under the Docker Compose *build pack* they are
#     not generated, so they would silently expand to empty strings — an
#     unauthenticated database and a blank public URL.
#   * `${VAR:?}` marks a variable required. Coolify parses that, flags the
#     field in its UI and blocks the deploy while it is empty. Leave the part
#     after `:?` EMPTY — Coolify reads it as a prefill default, not as an error
#     message, so `${POSTGRES_PASSWORD:?pick a password}` would hand the
#     database the literal password "pick a password".

name: affine

services:
  affine:
    build:
      context: .
      dockerfile: .docker/coolify/Dockerfile
      args:
        BUILD_TYPE: ${BUILD_TYPE:-stable}
        # Coolify sets SOURCE_COMMIT unless the build pack's toggle is off.
        # The Dockerfile substitutes a placeholder when it arrives empty.
        GIT_SHA: ${SOURCE_COMMIT:-}
        NODE_HEAP_MB: ${NODE_HEAP_MB:-6144}
    restart: unless-stopped
    # Tells Coolify which port to route the domain to. Not published on the
    # host — the proxy reaches it over the internal network.
    expose:
      - '3010'
    environment:
      AFFINE_SERVER_PORT: '3010'
      AFFINE_SERVER_HTTPS: ${AFFINE_SERVER_HTTPS:-true}
      AFFINE_SERVER_SUB_PATH: ${AFFINE_SERVER_SUB_PATH:-}
      # Leave these empty to let the entrypoint derive them from the domain
      # Coolify injects. Set them explicitly to pin the public URL.
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL:-}
      AFFINE_SERVER_HOST: ${AFFINE_SERVER_HOST:-}
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_FQDN: ${COOLIFY_FQDN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-affine}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-affine}
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_PORT: '6379'
      REDIS_SERVER_PASSWORD: ${REDIS_PASSWORD:?}
      NODE_OPTIONS: --max-old-space-size=${AFFINE_HEAP_MB:-2048}
      # SMTP — required for invites, password resets and email sign-in.
      MAILER_HOST: ${MAILER_HOST:-}
      MAILER_PORT: ${MAILER_PORT:-465}
      MAILER_USER: ${MAILER_USER:-}
      MAILER_PASSWORD: ${MAILER_PASSWORD:-}
      MAILER_SENDER: ${MAILER_SENDER:-AFFiNE Self Hosted <noreply@example.com>}
      MAILER_IGNORE_TLS: ${MAILER_IGNORE_TLS:-false}
    volumes:
      # Uploaded blobs. Losing this loses every image and attachment.
      - affine-storage:/root/.affine/storage
      # Holds the generated private.key — it signs sessions, so it must be
      # stable across redeploys or everyone gets logged out.
      - affine-config:/root/.affine/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:3010/info').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  postgres:
    # pgvector is required: AFFiNE stores embeddings for search and AI features.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affine}
      POSTGRES_DB: ${POSTGRES_DB:-affine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - affine-postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-affine} -d ${POSTGRES_DB:-affine}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - affine-redis:/data
    healthcheck:
      # $$ keeps the expansion inside the container instead of the compose file.
      test: redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  affine-storage:
  affine-config:
  affine-postgres:
  affine-redis:
